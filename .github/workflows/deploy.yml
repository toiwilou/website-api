name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:   # permet de lancer à la main depuis GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déploiement FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER_API }}
          password: ${{ secrets.FTP_PASSWORD_API }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/data/**
